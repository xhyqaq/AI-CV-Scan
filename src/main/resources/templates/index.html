<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 复杂任务处理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .task-card {
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .progress {
            height: 20px;
        }
        .loading-icon {
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        pre {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .result-container {
            max-height: 500px;
            overflow-y: auto;
        }
        .subtask-badge {
            margin-left: 10px;
            font-size: 0.8em;
        }
        .subtask-item {
            transition: background-color 0.3s ease;
        }
        .formatted-result {
            padding: 15px;
            line-height: 1.6;
        }
        .formatted-result h1,
        .formatted-result h2,
        .formatted-result h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #333;
        }
        .formatted-result ul,
        .formatted-result ol {
            padding-left: 20px;
            margin-bottom: 15px;
        }
        .formatted-result p {
            margin-bottom: 15px;
        }
        .formatted-result table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .formatted-result th,
        .formatted-result td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .formatted-result th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center">AI Agent 复杂任务处理系统</h1>
                <p class="text-center text-muted">基于LLM和Function Calling的多步骤任务处理系统</p>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">提交复杂任务</h5>
                    </div>
                    <div class="card-body">
                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskQuery" class="form-label">任务描述</label>
                                <textarea id="taskQuery" class="form-control" rows="3" placeholder="例如：帮我安排一个北京3天游玩的计划" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="submitBtn">提交任务</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="tasksContainer" class="row mt-4">
            <!-- 这里将动态添加任务卡片 -->
        </div>
    </div>

    <!-- 任务卡片模板 -->
    <template id="taskCardTemplate">
        <div class="col-12 task-card" data-task-id="">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 task-title">任务</h5>
                    <div>
                        <span class="badge bg-primary status-badge">处理中</span>
                        <button class="btn btn-sm btn-danger cancel-btn ms-2">取消</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <strong>原始查询:</strong>
                        <p class="task-query"></p>
                    </div>
                    
                    <div class="mb-3 progress-section">
                        <div class="d-flex justify-content-between mb-1">
                            <span>进度:</span>
                            <span class="progress-text">0%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="mb-3 current-task-section">
                        <strong>当前执行任务:</strong>
                        <p class="current-task"></p>
                    </div>
                    
                    <div class="subtasks-section mb-3">
                        <strong>子任务列表:</strong>
                        <ul class="subtasks-list list-group"></ul>
                    </div>
                    
                    <div class="result-section d-none">
                        <strong>任务结果:</strong>
                        <div class="result-container mt-2">
                            <pre class="result-json"></pre>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-muted">
                    <small>任务ID: <span class="task-id"></span></small>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskForm = document.getElementById('taskForm');
            const tasksContainer = document.getElementById('tasksContainer');
            const taskCardTemplate = document.getElementById('taskCardTemplate');
            
            // 存储活跃任务ID和对应的定时器
            const activeTasks = {};
            // 存储已显示的子任务列表
            const displayedSubtasks = {};
            
            // 提交任务表单
            taskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const taskQuery = document.getElementById('taskQuery').value.trim();
                if (!taskQuery) return;
                
                submitTask(taskQuery);
                
                // 清空表单
                document.getElementById('taskQuery').value = '';
            });
            
            // 提交任务
            async function submitTask(query) {
                try {
                    const response = await fetch('/api/complex-task/submit?query=' + encodeURIComponent(query), {
                        method: 'POST'
                    });
                    
                    if (!response.ok) {
                        throw new Error('提交任务失败');
                    }
                    
                    const data = await response.json();
                    console.log('任务提交成功:', data);
                    
                    // 创建任务卡片
                    createTaskCard(data.task_id, query);
                    
                    // 初始化子任务显示跟踪
                    displayedSubtasks[data.task_id] = false;
                    
                    // 开始轮询任务进度
                    startPolling(data.task_id);
                    
                } catch (error) {
                    console.error('提交任务出错:', error);
                    alert('提交任务失败: ' + error.message);
                }
            }
            
            // 创建任务卡片
            function createTaskCard(taskId, query) {
                const template = taskCardTemplate.content.cloneNode(true);
                const taskCard = template.querySelector('.task-card');
                
                taskCard.dataset.taskId = taskId;
                taskCard.querySelector('.task-id').textContent = taskId;
                taskCard.querySelector('.task-title').textContent = '复杂任务';
                taskCard.querySelector('.task-query').textContent = query;
                
                // 添加取消按钮事件
                taskCard.querySelector('.cancel-btn').addEventListener('click', function() {
                    cancelTask(taskId);
                });
                
                tasksContainer.prepend(taskCard);
                return taskCard;
            }
            
            // 开始轮询任务进度
            function startPolling(taskId) {
                // 每2秒查询一次进度
                const intervalId = setInterval(async function() {
                    try {
                        const progress = await getTaskProgress(taskId);
                        updateTaskCard(taskId, progress);
                        
                        // 如果任务已完成或失败，停止轮询
                        if (progress.status === 'completed' || progress.status === 'failed' || progress.status === 'cancelled') {
                            stopPolling(taskId);
                        }
                    } catch (error) {
                        console.error('获取任务进度出错:', error);
                        // 出错也停止轮询
                        stopPolling(taskId);
                    }
                }, 2000);
                
                activeTasks[taskId] = intervalId;
            }
            
            // 停止轮询
            function stopPolling(taskId) {
                if (activeTasks[taskId]) {
                    clearInterval(activeTasks[taskId]);
                    delete activeTasks[taskId];
                }
            }
            
            // 获取任务进度
            async function getTaskProgress(taskId) {
                const response = await fetch(`/api/complex-task/progress/${taskId}`);
                if (!response.ok) {
                    throw new Error('获取任务进度失败');
                }
                return await response.json();
            }
            
            // 取消任务
            async function cancelTask(taskId) {
                try {
                    const response = await fetch(`/api/complex-task/cancel/${taskId}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) {
                        throw new Error('取消任务失败');
                    }
                    
                    const data = await response.json();
                    console.log('任务取消结果:', data);
                    
                    // 更新UI
                    const taskCard = document.querySelector(`.task-card[data-task-id="${taskId}"]`);
                    if (taskCard) {
                        taskCard.querySelector('.status-badge').textContent = '已取消';
                        taskCard.querySelector('.status-badge').classList.remove('bg-primary');
                        taskCard.querySelector('.status-badge').classList.add('bg-secondary');
                        taskCard.querySelector('.cancel-btn').disabled = true;
                    }
                    
                    // 停止轮询
                    stopPolling(taskId);
                    
                } catch (error) {
                    console.error('取消任务出错:', error);
                    alert('取消任务失败: ' + error.message);
                }
            }
            
            // 更新任务卡片
            function updateTaskCard(taskId, progress) {
                const taskCard = document.querySelector(`.task-card[data-task-id="${taskId}"]`);
                if (!taskCard) return;
                
                // 更新进度条
                const progressPercentage = progress.progress_percentage || 0;
                taskCard.querySelector('.progress-bar').style.width = progressPercentage + '%';
                taskCard.querySelector('.progress-text').textContent = Math.round(progressPercentage) + '%';
                
                // 更新当前执行的任务
                if (progress.current_task) {
                    taskCard.querySelector('.current-task').textContent = progress.current_task;
                }
                
                // 更新子任务列表 - 一旦子任务被分解出来，就立即显示
                if (progress.subtasks && progress.subtasks.length > 0) {
                    updateSubtasksList(taskCard, progress);
                }
                
                // 更新状态
                const statusBadge = taskCard.querySelector('.status-badge');
                switch (progress.status) {
                    case 'completed':
                        statusBadge.textContent = '已完成';
                        statusBadge.classList.remove('bg-primary');
                        statusBadge.classList.add('bg-success');
                        taskCard.querySelector('.cancel-btn').disabled = true;
                        
                        // 显示结果
                        showResult(taskCard, progress);
                        break;
                        
                    case 'failed':
                        statusBadge.textContent = '失败';
                        statusBadge.classList.remove('bg-primary');
                        statusBadge.classList.add('bg-danger');
                        taskCard.querySelector('.cancel-btn').disabled = true;
                        
                        // 显示错误信息
                        showError(taskCard, progress);
                        break;
                        
                    case 'in_progress':
                        statusBadge.textContent = '处理中';
                        break;
                        
                    case 'initializing':
                        statusBadge.textContent = '初始化中';
                        break;
                        
                    case 'cancelled':
                        statusBadge.textContent = '已取消';
                        statusBadge.classList.remove('bg-primary');
                        statusBadge.classList.add('bg-secondary');
                        taskCard.querySelector('.cancel-btn').disabled = true;
                        break;
                }
            }
            
            // 更新子任务列表
            function updateSubtasksList(taskCard, progress) {
                const subtasksList = taskCard.querySelector('.subtasks-list');
                const taskId = taskCard.dataset.taskId;
                
                // 获取已完成的任务数量和当前任务
                const completedTasks = progress.completed_tasks || 0;
                const currentTask = progress.current_task || "";
                
                // 如果已经显示过子任务列表，则只更新状态
                if (displayedSubtasks[taskId]) {
                    // 更新已完成的子任务状态
                    const listItems = subtasksList.querySelectorAll('li');
                    
                    // 首先移除所有高亮标记
                    listItems.forEach(item => {
                        item.classList.remove('list-group-item-primary');
                    });
                    
                    for (let i = 0; i < listItems.length; i++) {
                        const listItem = listItems[i];
                        const subtaskSpan = listItem.querySelector('span:first-child');
                        const subtaskText = subtaskSpan ? subtaskSpan.textContent : '';
                        
                        // 判断是否完成
                        const isCompleted = i < completedTasks;
                        // 判断是否是当前任务 - 注意：已完成的任务不应该标记为当前任务
                        const isCurrent = !isCompleted && currentTask && subtaskText.includes(currentTask);
                        
                        // 清除之前的所有徽章
                        const badges = listItem.querySelectorAll('.badge');
                        badges.forEach(badge => badge.remove());
                        
                        // 根据状态添加相应的样式和徽章
                        if (isCompleted) {
                            // 已完成的任务
                            listItem.classList.add('list-group-item-success');
                            listItem.classList.remove('list-group-item-primary');
                            
                            // 添加"已完成"徽章
                            const successBadge = document.createElement('span');
                            successBadge.className = 'badge bg-success';
                            successBadge.textContent = '已完成';
                            listItem.appendChild(successBadge);
                        } else if (isCurrent) {
                            // 当前执行的任务
                            listItem.classList.add('list-group-item-primary');
                            listItem.classList.remove('list-group-item-success');
                            
                            // 添加"进行中"徽章
                            const infoBadge = document.createElement('span');
                            infoBadge.className = 'badge bg-info';
                            infoBadge.textContent = '进行中';
                            listItem.appendChild(infoBadge);
                        } else {
                            // 等待执行的任务
                            listItem.classList.remove('list-group-item-success');
                            listItem.classList.remove('list-group-item-primary');
                            
                            // 添加"等待中"徽章
                            const waitingBadge = document.createElement('span');
                            waitingBadge.className = 'badge bg-secondary';
                            waitingBadge.textContent = '等待中';
                            listItem.appendChild(waitingBadge);
                        }
                    }
                } else {
                    // 首次显示子任务列表
                    subtasksList.innerHTML = '';
                    
                    progress.subtasks.forEach((subtask, index) => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between align-items-center subtask-item';
                        
                        // 判断状态
                        const isCompleted = index < completedTasks;
                        const isCurrent = !isCompleted && currentTask && subtask.includes(currentTask);
                        
                        // 添加相应的样式
                        if (isCompleted) {
                            li.classList.add('list-group-item-success');
                        } else if (isCurrent) {
                            li.classList.add('list-group-item-primary');
                        }
                        
                        // 设置内容和状态徽章
                        li.innerHTML = `
                            <span>${subtask}</span>
                            ${isCompleted ? '<span class="badge bg-success">已完成</span>' : 
                             isCurrent ? '<span class="badge bg-info">进行中</span>' : 
                                        '<span class="badge bg-secondary">等待中</span>'}
                        `;
                        
                        subtasksList.appendChild(li);
                    });
                    
                    // 标记为已显示
                    displayedSubtasks[taskId] = true;
                }
            }
            
            // 显示结果
            function showResult(taskCard, result) {
                const resultSection = taskCard.querySelector('.result-section');
                resultSection.classList.remove('d-none');
                
                // 清空之前的内容
                const resultContainer = taskCard.querySelector('.result-container');
                resultContainer.innerHTML = '';
                
                // 使用润色后的结果
                if (result.polished_result) {
                    // 添加任务结果标题
                    const resultTitle = document.createElement('h3');
                    resultTitle.className = 'mb-3';
                    resultTitle.textContent = '任务结果';
                    resultContainer.appendChild(resultTitle);
                    
                    // 润色结果包含markdown格式，使用marked解析并显示
                    const formattedResult = document.createElement('div');
                    formattedResult.className = 'formatted-result';
                    formattedResult.innerHTML = marked.parse(result.polished_result);
                    resultContainer.appendChild(formattedResult);
                } else {
                    // 如果没有润色结果，则显示原始JSON
                    const preElement = document.createElement('pre');
                    preElement.className = 'result-json';
                    preElement.textContent = JSON.stringify(result.results, null, 2);
                    resultContainer.appendChild(preElement);
                }
            }
            
            // 显示错误
            function showError(taskCard, error) {
                const resultSection = taskCard.querySelector('.result-section');
                resultSection.classList.remove('d-none');
                
                // 显示错误信息
                taskCard.querySelector('.result-json').textContent = '任务执行失败: ' + (error.error || '未知错误');
            }
        });
    </script>
</body>
</html>
